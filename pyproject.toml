[project]
name = "mylangchain-uv-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "xhonx", email = "xoho.onox@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "docx2txt>=0.9",
    "faiss-cpu>=1.15.1",
    "fastapi>=0.142.2",
    "gradio>=6.29.1",
    "gradio-pdf>=0.0.24",
    "langchain>=1.4.3",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.7",
    "langchain-tavily>=0.2.18",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.14",
    "langserve>=0.3.3",
    "langsmith>=0.14.4",
    "python-dotenv>=1.2.4",
    "sse-starlette>=3.5.0",
    "transformers>=5.19.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
mylangchain-uv-project = "mylangchain_uv_project:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
